name: Backend CI

on:
  pull_request:
    branches:
      - master
      - develope
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/promtDeck/gradlew

      - name: Build with Gradle
        working-directory: backend/promtDeck
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          JWT_SECRET: ci-dummy-secret-value-for-build-only
          PROVIDER_API_KEY_PASSWORD: ci-dummy
          PROVIDER_API_KEY_SALT: ci-dummy
