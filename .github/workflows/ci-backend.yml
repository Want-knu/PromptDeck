name: Backend CI

on:
  pull_request:
    branches:
      - master
      - develope
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/promtDeck/gradlew

      - name: Build with Gradle
        working-directory: backend/promtDeck
        run: ./gradlew build --no-daemon
        # 테스트는 @ActiveProfiles("test")로 application-test.yml(H2 + 더미값)을 사용한다.
        # 여기서 env로 값을 덮어쓰면 안 된다: CI에는 MySQL 서버가 없고, salt는 hex여야 하므로
        # (Encryptors.delux가 Hex.decode), 잘못된 값을 주면 컨텍스트 로딩이 실패한다.
